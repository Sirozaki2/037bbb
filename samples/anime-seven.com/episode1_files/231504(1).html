<script>
$(document).ready(function() {
    var videoMessage = "\u0e01\u0e33\u0e25\u0e31\u0e07\u0e1b\u0e23\u0e30\u0e21\u0e27\u0e25\u0e1c\u0e25 \u0e2b\u0e23\u0e37\u0e2d \u0e2d\u0e32\u0e08\u0e08\u0e30\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e1c\u0e34\u0e14\u0e1e\u0e25\u0e32\u0e14";

    function showVideoMessage() {
        $("#video-message").text(videoMessage);
        $("#video_container").attr('src', '');
        $("#load-iframe").hide();
        $("#video-message").css("display", "flex");
    }

    function loadIframe(link) {
        if (link) {
            $("#video-message").hide();
            $("#load-iframe").show();
            $("#video_container").attr('src', link);
        } else {
            showVideoMessage();
        }
    }

    var firstServer = $(".list-server-items li.linkserver").eq(0);
    var firstLink = firstServer.attr('data-video');
    var firstStatus = firstServer.attr('data-status');

    if (firstStatus == 1) {
        loadIframe(firstLink);
    } else {
        showVideoMessage();
    }

    $(".list-server-items li").removeClass("active");
    firstServer.addClass("active");

    $("#show-server").click(function(e) {
        e.preventDefault();
        $(".list-server-items").toggle();
    });

    $(".list-server-items li.linkserver").click(function(e) {
        e.preventDefault();
        var link = $(this).attr('data-video');
        var data_status = $(this).attr('data-status');

        if ($(this).hasClass("active")) return;

        if (data_status == 1) {
            loadIframe(link);
        } else {
            showVideoMessage();
        }

        $(".list-server-items li").removeClass("active");
        $(this).addClass("active");

        setTimeout(function() {
            $(".list-server-items").css("display", "none");
        }, 2000);
    });
});
</script>
