    <div id="ad-overlay">
        <video id="ad-video" playsinline=""></video>
        <span id="ad-badge">Ad</span>
        <button id="ad-skip" disabled="">Skip</button>
    </div>
    <script>
        // Flatten domain ads into a simple pre-roll queue.
        function buildAdQueue(list) {
            const queue = [];
            (Array.isArray(list) ? list : []).forEach((ad) => {
                (ad.sources || []).forEach((s) => {
                    if (s && s.file) {
                        queue.push({
                            file: s.file,
                            skiptime: parseInt(s.skiptime, 10) || 0,
                            clickUrl: s.clickUrl || ad.clickUrl || ''
                        });
                    }
                });
            });
            return queue;
        }

        // Play pre-roll ads sequentially, then resolve to start main content.
        function playPreroll(queue) {
            return new Promise((resolve) => {
                if (!queue.length) return resolve();
                const overlay = document.getElementById('ad-overlay');
                const adVideo = document.getElementById('ad-video');
                const skipBtn = document.getElementById('ad-skip');
                let idx = 0;
                let timer = null;

                function finish() {
                    if (timer) clearInterval(timer);
                    overlay.style.display = 'none';
                    try { adVideo.pause(); } catch (e) { }
                    resolve();
                }

                function playNext() {
                    if (idx >= queue.length) return finish();
                    const ad = queue[idx++];
                    let remaining = ad.skiptime;

                    skipBtn.disabled = remaining > 0;
                    skipBtn.textContent = remaining > 0 ? ('Skip in ' + remaining) : 'Skip';
                    if (timer) clearInterval(timer);
                    if (remaining > 0) {
                        timer = setInterval(() => {
                            remaining -= 1;
                            if (remaining <= 0) {
                                clearInterval(timer);
                                skipBtn.disabled = false;
                                skipBtn.textContent = 'Skip';
                            } else {
                                skipBtn.textContent = 'Skip in ' + remaining;
                            }
                        }, 1000);
                    }

                    adVideo.src = ad.file;
                    adVideo.onclick = () => { if (ad.clickUrl) window.open(ad.clickUrl, '_blank'); };
                    adVideo.onended = () => { playNext(); };
                    adVideo.onerror = () => { playNext(); };
                    adVideo.play().catch(() => playNext());
                }

                skipBtn.onclick = () => { if (!skipBtn.disabled) playNext(); };
                overlay.style.display = 'block';
                playNext();
            });
        }

        // --- P2P live stats (updated from p2p-media-loader engine events) ---
        const p2pStats = { peers: 0, httpKB: 0, p2pDownKB: 0, p2pUpKB: 0, active: false, fsHidden: false, userHidden: true };
        function fmtMB(kb) { return (kb / 1024).toFixed(1) + ' MB'; }
        function renderP2PStats() {
            const el = document.querySelector('.p2p-badge');
            if (!el) return;
            // Hide in fullscreen, or when the user toggled it off via the button.
            if (p2pStats.fsHidden || p2pStats.userHidden) { el.style.display = 'none'; return; }
            const totalDown = p2pStats.p2pDownKB + p2pStats.httpKB;
            const ratio = totalDown > 0 ? Math.round((p2pStats.p2pDownKB / totalDown) * 100) : 0;
            el.style.display = 'block';
            el.innerHTML =
                '<span class="p2p-dot">●</span> P2P · ' + p2pStats.peers + ' peers'
                + ' · ดาวน์โหลด P2P ' + fmtMB(p2pStats.p2pDownKB) + ' (' + ratio + '%)'
                + ' · HTTP ' + fmtMB(p2pStats.httpKB)
                + ' · อัปโหลด ' + fmtMB(p2pStats.p2pUpKB);
        }
        // Wire engine events + add an on-player status layer.
        function attachP2PStats(engine) {
            try {
                p2pStats.active = true;
                const Events = window.p2pml && window.p2pml.core && window.p2pml.core.Events;
                if (!Events) return;
                if (window.player && window.player.layers && !document.querySelector('.p2p-badge')) {
                    window.player.layers.add({
                        name: 'p2pStats',
                        html: '<div class="p2p-badge" style="display:none"></div>',
                        style: { position: 'absolute', left: '12px', bottom: '54px', zIndex: '60' },
                    });
                }
                // Hide the badge whenever the player enters fullscreen (native or web).
                if (window.player) {
                    p2pStats.fsHidden = !!(window.player.fullscreen || window.player.fullscreenWeb);
                    window.player.on('fullscreen', (state) => { p2pStats.fsHidden = state || window.player.fullscreenWeb; renderP2PStats(); });
                    window.player.on('fullscreenWeb', (state) => { p2pStats.fsHidden = state || window.player.fullscreen; renderP2PStats(); });
                }
                // Toggle button to show/hide the P2P status badge on demand.
                // Sits in the top-right corner as its own layer (not in the control
                // bar), so it stays put and doesn't move with the controls.
                if (window.player && window.player.layers && !document.querySelector('.p2p-toggle')) {
                    window.player.layers.add({
                        name: 'p2pToggle',
                        html: '<div class="p2p-toggle" title="แสดง/ซ่อน สถานะ P2P"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg></div>',
                        style: { position: 'absolute', top: '12px', right: '12px', zIndex: '60' },
                        mounted: function ($el) { $el.style.opacity = p2pStats.userHidden ? '0.45' : '1'; },
                        click: function () {
                            p2pStats.userHidden = !p2pStats.userHidden;
                            const btn = document.querySelector('.art-layer-p2pToggle');
                            if (btn) btn.style.opacity = p2pStats.userHidden ? '0.45' : '1';
                            renderP2PStats();
                        },
                    });
                }
                // .art-layers starts hidden until the layer group is switched on.
                if (window.player && window.player.layers) window.player.layers.show = true;
                engine.on(Events.PeerConnect, () => { p2pStats.peers++; renderP2PStats(); });
                engine.on(Events.PeerClose, () => { p2pStats.peers = Math.max(0, p2pStats.peers - 1); renderP2PStats(); });
                engine.on(Events.PieceBytesDownloaded, (method, bytes) => {
                    if (method === 'p2p') p2pStats.p2pDownKB += bytes / 1024;
                    else p2pStats.httpKB += bytes / 1024;
                    renderP2PStats();
                });
                engine.on(Events.PieceBytesUploaded, (method, bytes) => {
                    p2pStats.p2pUpKB += bytes / 1024;
                    renderP2PStats();
                });
                renderP2PStats();
            } catch (e) { /* stats are best-effort; never break playback */ }
        }

        // Cast the m3u8 to a Chromecast device via the default media receiver.
        function startCast() {
            if (!window.__castReady || typeof cast === 'undefined' || typeof chrome === 'undefined' || !chrome.cast) {
                if (window.player) window.player.notice.show = 'Chromecast ใช้ได้บน Chrome / Android เท่านั้น';
                return;
            }
            try {
                const context = cast.framework.CastContext.getInstance();
                context.requestSession().then(function () {
                    const session = context.getCurrentSession();
                    if (!session) return;
                    const mediaInfo = new chrome.cast.media.MediaInfo(url, 'application/x-mpegURL');
                    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
                    mediaInfo.metadata.title = castTitle;
                    if (poster) { mediaInfo.metadata.images = [new chrome.cast.Image(poster)]; }
                    const request = new chrome.cast.media.LoadRequest(mediaInfo);
                    session.loadMedia(request).then(
                        function () { if (window.player) window.player.notice.show = 'กำลังส่งไปยังทีวี…'; },
                        function (err) { if (window.player) window.player.notice.show = 'Cast ไม่สำเร็จ'; }
                    );
