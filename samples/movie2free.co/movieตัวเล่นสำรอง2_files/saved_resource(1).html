    <script>
        // ป้องกันคลิกขวา/copy/F12 — ทำงานได้ทันทีโดยไม่ต้องรอ DOMContentLoaded
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);
        document.addEventListener('copy', function(e) {
            e.preventDefault();
        }, false);
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) ||
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        }, false);

        // จัดการเปลี่ยนตัวเล่น (vanilla JS แทน jQuery)
        (function() {
            var mainPlayer = document.getElementById('main-player');
            var backupPlayer = document.getElementById('backup-player');
            var mainIframe = document.getElementById('main-iframe');
            var backupIframe = document.getElementById('backup-iframe');
            var buttons = document.querySelectorAll('.linkserver');

            function switchTo(btn) {
                if (btn.classList.contains('active')) return;

                var url = btn.getAttribute('data-url');

                // หยุด iframe ทั้งหมด
                if (mainIframe) mainIframe.src = 'about:blank';
                if (backupIframe) backupIframe.src = 'about:blank';

                // อัปเดตสถานะปุ่ม
                for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
                btn.classList.add('active');

                // ซ่อนทุกตัวเล่น
                if (mainPlayer) mainPlayer.style.display = 'none';
                if (backupPlayer) backupPlayer.style.display = 'none';

                // โหลดในตัวเล่นสำรอง (เร็วขึ้นจาก 500ms เหลือ 100ms)
                setTimeout(function() {
                    if (backupIframe) {
                        backupIframe.src = url;
                        backupPlayer.style.display = 'block';
                    }
                }, 100);
            }

            for (var i = 0; i < buttons.length; i++) {
                buttons[i].addEventListener('click', function(e) {
                    e.preventDefault();
                    switchTo(this);
                });
            }
        })();
